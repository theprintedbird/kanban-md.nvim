name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repo, so the token gets no more than it needs.
permissions:
  contents: read

# A new push to a PR supersedes the run already going for it. Pushes to master
# are left to finish so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Luacheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No submodule: .luacheckrc excludes lib/, since the engine lints itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13.0.0
        # LuaJIT is what Neovim embeds, matching std = "luajit" in .luacheckrc.
        with:
          luaVersion: "luajit-2.1"

      - uses: leafo/gh-actions-luarocks@35d062def313a7699a0d513e996bcf4352f05389 # v6.1.0

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Lint
        run: luacheck lua plugin ftdetect tests lazy.lua

  test:
    name: Tests (${{ matrix.os }}, nvim ${{ matrix.nvim }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Nightly is there to give early warning of upstream changes, so its
    # failures show on the job without failing the run.
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nvim: [stable]
        # The minimum supported version (see README) and nightly run on Linux
        # only, to save macOS minutes.
        include:
          - os: ubuntu-latest
            nvim: v0.9.5
          - os: ubuntu-latest
            nvim: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The engine submodule is private and its .gitmodules URL is SSH,
        # which the checkout action's HTTPS token can't follow. It's fetched
        # below once the deploy key is loaded, so the token needn't be left
        # in .git/config either.
        with:
          submodules: false
          persist-credentials: false

      - name: Load the engine deploy key
        # A read-only deploy key on kanban-md-engine. Loading it into an agent
        # lets the SSH URL in .gitmodules stay as it is for local development.
        # Pinned to a commit, since this step is handed the private key.
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.ENGINE_DEPLOY_KEY }}

      - name: Fetch the engine submodule
        run: git submodule update --init --recursive

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      - name: Neovim version
        # Recorded so a red run can be matched to the Neovim that produced it.
        run: nvim --version

      - name: Run tests
        # The cache lives under the runner's temp dir, so plenary is cloned
        # fresh each run. It's pinned so an upstream change can't turn the
        # suite red on its own.
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
          PLENARY_REF: v0.1.4
        run: ./tests/run_tests.sh
